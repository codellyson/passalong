# Every push and pull request runs the checks. A green push to master then deploys the Worker.
#
# Secrets the deploy job needs (repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + D1:Edit (see docs/DEPLOY.md)
#   CLOUDFLARE_ACCOUNT_ID  not sensitive, but kept alongside the token
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm -C apps/api lint
      - name: Typecheck web
        run: pnpm -C apps/web lint
      - name: Test
        run: pnpm -r test
      # apps/api is no longer deployed on its own — apps/web mounts its Hono app — so there is one
      # Worker to build and dry-run, and the dry run needs the build output to exist.
      - name: Build
        run: pnpm -C apps/web build
      - name: Worker dry run
        run: pnpm -C apps/web deploy:check
      # Jobs can't read secrets in their `if`, so surface "is deploy configured" as an output.
      # Until the token is set, pushes to master run the checks and skip the deploy cleanly.
      - id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
    outputs:
      deploy-ready: ${{ steps.cf.outputs.ready }}

  # The task queue end to end: the CLI's own operations against a real local server, with the real
  # migrations on a local D1 (packages/passalong/test/task-flow.e2e.test.js). Separate from `check`
  # because it needs a running Worker, and gating the deploy because it is the only test that
  # crosses the network boundary the product is made of.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local D1 with every migration
        run: pnpm -C apps/web exec wrangler d1 migrations apply passalong --local
      - name: Start the local server
        run: |
          pnpm -C apps/web exec nuxt dev --port 3001 > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3001/v1/openapi.json > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/dev.log"; exit 1
      - name: End to end
        run: pnpm -C packages/passalong test:e2e
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/dev.log"

  deploy:
    needs: [check, e2e]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.check.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and a newer push supersedes a queued one.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations still live with the schema in apps/api, and its wrangler.jsonc still names the
      # database. Only the deploy moved.
      - name: Apply D1 migrations
        run: pnpm -C apps/api db:migrate:remote
      - name: Build
        run: pnpm -C apps/web build
      - name: Deploy Worker
        run: pnpm -C apps/web run deploy
      - name: Smoke test
        run: |
          # Both hosts, because the old one carries share links already in circulation.
          for host in passalong.dev passalong.kreativekorna.com; do
            up=""
            for i in 1 2 3 4 5 6; do
              if curl -fsS "https://$host/health"; then up=1; break; fi
              sleep 10
            done
            if [ -z "$up" ]; then echo "health check never came up on $host" >&2; exit 1; fi
          done
          # A page and the API, so the smoke test covers both halves of the one Worker now that
          # `/health` alone would pass with every page broken.
          # The brand's class, not its whole attribute: utilities ride along on it (`brand shrink-0`),
          # and matching the full string failed a good deploy when one was added.
          curl -fsS https://passalong.dev/ | grep -qE 'class="brand[ "]'
          curl -fsS https://passalong.dev/v1/me -o /dev/null -w '%{http_code}' | grep -q 401
