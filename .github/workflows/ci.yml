# Every push and pull request runs the checks. A green push to master then deploys the Worker.
#
# Secrets the deploy job needs (repo → Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + D1:Edit (see docs/DEPLOY.md)
#   CLOUDFLARE_ACCOUNT_ID  not sensitive, but kept alongside the token
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm -C apps/api lint
      - name: Test
        run: pnpm -r test
      - name: Worker dry run
        run: pnpm -C apps/api deploy:check
      # Jobs can't read secrets in their `if`, so surface "is deploy configured" as an output.
      # Until the token is set, pushes to master run the checks and skip the deploy cleanly.
      - id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
    outputs:
      deploy-ready: ${{ steps.cf.outputs.ready }}

  deploy:
    needs: check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.check.outputs.deploy-ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and a newer push supersedes a queued one.
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm -C apps/api db:migrate:remote
      - name: Deploy Worker
        run: pnpm -C apps/api run deploy
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://passalong.kreativekorna.com/health; then exit 0; fi
            sleep 10
          done
          echo "health check never came up" >&2; exit 1
