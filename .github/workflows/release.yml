# Publishes the CLI to npm when a version tag is pushed. The Worker deploys on every master push
# (ci.yml); the package is released deliberately, because users install it.
#
#   cd packages/passalong && npm version patch   # bumps package.json, commits, tags vX.Y.Z
#   git push && git push --tags
#
# Auth is npm trusted publishing (OIDC): npm trusts this repo + this workflow file, GitHub mints
# a short-lived identity token per run, and provenance is attached automatically. No NPM_TOKEN.
# Requires npm ≥ 11.5.1, newer than the one bundled with Node 22, hence the upgrade step.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/passalong test
      - name: Tag must match package version
        run: |
          v="$(node -p "require('./packages/passalong/package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$v" >&2; exit 1; }
      - name: Publish
        run: cd packages/passalong && npm publish
