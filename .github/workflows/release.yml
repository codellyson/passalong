# Publishes the CLI to npm. There are no release tags to cut by hand: master is the trigger and
# the version in packages/passalong/package.json is the signal. Bump it in a normal commit, push,
# and this publishes; leave it alone and the job stops at the first step. That matches how the
# Worker already ships (ci.yml deploys every master push) instead of asking for a second ritual.
#
#   cd packages/passalong && npm version patch --no-git-tag-version
#   git commit -am "…" && git push
#
# Auth is npm trusted publishing (OIDC): npm trusts this repo + this workflow file, GitHub mints a
# short-lived identity token per run, and provenance is attached automatically. No NPM_TOKEN.
# It has to be registered on npmjs.com first — package passalong → Settings → Trusted Publisher →
# GitHub Actions, owner codellyson, repository passalong, workflow release.yml, no environment.
# Without it npm answers `403 OIDC permission denied for this action`.
# Requires npm >= 11.5.1, newer than the one bundled with Node 22, hence the upgrade step.
name: release

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The registry is the source of truth for what has shipped, so nothing has to be remembered
      # between runs: if this exact version is already there, the rest of the job is skipped.
      - name: Is this version already on npm?
        id: check
        run: |
          v="$(node -p "require('./packages/passalong/package.json').version")"
          if npm view "passalong@$v" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "passalong@$v is already published — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "passalong@$v is new — publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.publish == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest && npm --version
        if: steps.check.outputs.publish == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.publish == 'true'
      - run: pnpm -C packages/passalong test
        if: steps.check.outputs.publish == 'true'

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: cd packages/passalong && npm publish
