# Passalong's runner as a scheduled GitHub Actions workflow: no computer to keep on, and the
# latest passalong every time. Each run takes the work marked safe to run alone for this repo,
# has Claude Code do it on its own branch, opens a pull request, and hands it in. The work then
# waits on the hub as "Ready for your review" until you approve it or send it back.
#
# Save as .github/workflows/passalong-runner.yml, then in the repo's Settings > Secrets and
# variables > Actions, add:
#   PASSALONG_TOKEN          a token from the hub: Settings > Tokens
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (your Claude plan), or
#   ANTHROPIC_API_KEY        instead, to pay per use through the API
# and under Settings > Actions > General, allow GitHub Actions to create pull requests.

name: Passalong runner
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One at a time: two runs at once would ask for the same work.
concurrency: passalong-runner

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global passalong@latest @anthropic-ai/claude-code
      - run: |
          git config --global user.name "Passalong runner"
          git config --global user.email "runner@passalong.dev"
          git remote set-head origin --auto
      - run: passalong work --watch
        env:
          PASSALONG_TOKEN: ${{ secrets.PASSALONG_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
